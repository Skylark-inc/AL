<script>
(() => {
    "use strict";

    const EDITIONS_URL =
        "https://skylark-inc.github.io/editions.json";

    const MAIN_PAGE_URL =
        "https://skylark-inc.github.io";

    function redirect(url) {
        window.location.replace(url);
    }

    function compareVersions(a, b) {
        const A = String(a).split(".").map(Number);
        const B = String(b).split(".").map(Number);

        const length = Math.max(A.length, B.length);

        for (let i = 0; i < length; i++) {
            const x = A[i] ?? 0;
            const y = B[i] ?? 0;

            if (x > y) return 1;
            if (x < y) return -1;
        }

        return 0;
    }

    function isAppleMobileDevice() {
        const ua = navigator.userAgent;

        // iPhone / iPad / iPod
        if (/iPhone|iPad|iPod/i.test(ua)) {
            return true;
        }

        // iPad using desktop-class identification
        if (
            navigator.platform === "MacIntel" &&
            navigator.maxTouchPoints > 1
        ) {
            return true;
        }

        return false;
    }

    function getVersion() {
        const ua = navigator.userAgent;

        /*
         * IMPORTANT:
         *
         * Skylark Auto Launch uses the Safari Version/
         * identifier.
         *
         * Example:
         *
         * Mozilla/5.0 (iPhone; CPU iPhone OS 18_7 like Mac OS X)
         * AppleWebKit/605.1.15 (KHTML, like Gecko)
         * Version/18.7.5 Mobile/15E148 Safari/604.1
         *
         * Result:
         *
         * 18.7.5
         *
         * Do NOT use:
         *
         * CPU iPhone OS 18_7
         */

        const match =
            ua.match(/Version\/(\d+(?:\.\d+)*)/i);

        return match ? match[1] : null;
    }

    function findEdition(editions, version) {
        return editions.find(edition => {
            if (
                edition.min == null ||
                edition.max == null
            ) {
                return false;
            }

            return (
                compareVersions(
                    version,
                    edition.min
                ) >= 0 &&
                compareVersions(
                    version,
                    edition.max
                ) <= 0
            );
        });
    }

    async function autoLaunch() {

        /*
         * AL is exclusively for Apple mobile devices
         * with a dedicated Skylark release page.
         *
         * Mac, Android, Windows, Linux, etc. → Home
         */
        if (!isAppleMobileDevice()) {
            redirect(MAIN_PAGE_URL);
            return;
        }

        /*
         * Read Version/x.x.x from the user agent.
         */
        const version = getVersion();

        if (!version) {
            redirect(MAIN_PAGE_URL);
            return;
        }

        try {
            const response = await fetch(
                EDITIONS_URL,
                {
                    cache: "no-store"
                }
            );

            if (!response.ok) {
                throw new Error(
                    "Could not load editions.json"
                );
            }

            const editions = await response.json();

            if (!Array.isArray(editions)) {
                throw new Error(
                    "Invalid editions.json"
                );
            }

            const edition =
                findEdition(editions, version);

            /*
             * No matching edition → Home
             */
            if (!edition) {
                redirect(MAIN_PAGE_URL);
                return;
            }

            /*
             * EOL editions do not use AL.
             */
            if (edition.eol === true) {
                redirect(MAIN_PAGE_URL);
                return;
            }

            /*
             * AL ONLY launches editions with
             * an actual releasePage.
             *
             * No releasePage → Home
             */
            if (
                typeof edition.releasePage !== "string" ||
                edition.releasePage.trim() === ""
            ) {
                redirect(MAIN_PAGE_URL);
                return;
            }

            /*
             * 🚀 AUTO LAUNCH
             */
            redirect(
                edition.releasePage.trim()
            );

        } catch (error) {
            console.error(
                "Skylark Auto Launch failed:",
                error
            );

            redirect(MAIN_PAGE_URL);
        }
    }

    autoLaunch();
})();
</script>

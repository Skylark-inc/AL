<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Auto Launch</title>

<script>
(() => {
    "use strict";

    const EDITIONS_URL = "https://skylark-inc.github.io/editions.json";
    const FIND_EDITION_URL = "https://skylark-inc.github.io/FindEdition";
    const EOL_URL = "https://skylark-inc.github.io/NonServer/";

    /*
     * Skylark Auto Launch
     * /AL
     *
     * Internal routing service.
     *
     * This page must not contain individual Skylark edition,
     * download, or release-page URLs.
     *
     * editions.json is the single source of truth.
     */

    function redirect(url) {
        window.location.replace(url);
    }

    function versionParts(version) {
        if (typeof version !== "string") {
            version = String(version ?? "");
        }

        const parts = version
            .replace(/_/g, ".")
            .match(/\d+/g);

        if (!parts) return null;

        return parts.map(Number);
    }

    function compareVersions(a, b) {
        const va = versionParts(a);
        const vb = versionParts(b);

        if (!va || !vb) return 0;

        const length = Math.max(va.length, vb.length);

        for (let i = 0; i < length; i++) {
            const x = va[i] ?? 0;
            const y = vb[i] ?? 0;

            if (x > y) return 1;
            if (x < y) return -1;
        }

        return 0;
    }

    function majorVersion(version) {
        const parts = versionParts(version);
        return parts ? parts[0] : null;
    }

    function getAppleOSVersion() {
        const ua = navigator.userAgent;

        /*
         * Standard iPhone / iPad / iPod user agents.
         *
         * Examples:
         * iPhone OS 18_7_7
         * CPU OS 18_7 like Mac OS X
         */
        let match = ua.match(
            /(?:iPhone\s+OS|CPU\s+(?:iPhone\s+)?OS)\s+(\d+(?:[_\.]\d+)*)/i
        );

        if (match) {
            return match[1].replace(/_/g, ".");
        }

        /*
         * Older/alternate Apple mobile UA formats.
         */
        match = ua.match(/\bOS\s+(\d+(?:[_\.]\d+)*)\s+like\s+Mac\s+OS\s+X/i);

        if (
            match &&
            (
                /iPhone|iPad|iPod/i.test(ua) ||
                navigator.maxTouchPoints > 1
            )
        ) {
            return match[1].replace(/_/g, ".");
        }

        /*
         * iPadOS can request a desktop-class browser identity.
         * If the actual iPadOS version is unavailable, do not guess.
         */
        return null;
    }

    function normalizeEditions(data) {
        /*
         * Supports either:
         *
         * [
         *   { ... },
         *   { ... }
         * ]
         *
         * or:
         *
         * {
         *   "editions": [
         *      { ... },
         *      { ... }
         *   ]
         * }
         *
         * This gives editions.json room to remain backwards compatible.
         */

        if (Array.isArray(data)) {
            return data;
        }

        if (data && Array.isArray(data.editions)) {
            return data.editions;
        }

        return [];
    }

    function findEdition(editions, osVersion) {
        /*
         * First preference:
         * OS is inside the edition's confirmed min/max range.
         */

        const confirmed = editions.find(edition => {
            if (!edition) return false;
            if (edition.min == null || edition.max == null) return false;

            return (
                compareVersions(osVersion, edition.min) >= 0 &&
                compareVersions(osVersion, edition.max) <= 0
            );
        });

        if (confirmed) {
            return confirmed;
        }

        /*
         * Skylark compatibility rule:
         *
         * If the OS is newer than the confirmed max but remains
         * within that same major iOS/iPadOS release, allow that
         * edition to handle the user.
         *
         * Any compatibility warning belongs on the destination
         * release page, not inside Auto Launch.
         */

        const osMajor = majorVersion(osVersion);

        const sameMajor = editions
            .filter(edition => {
                if (!edition || edition.min == null || edition.max == null) {
                    return false;
                }

                return (
                    majorVersion(edition.max) === osMajor &&
                    compareVersions(osVersion, edition.max) > 0
                );
            })
            .sort((a, b) => compareVersions(b.max, a.max));

        return sameMajor[0] || null;
    }

    async function autoLaunch() {
        try {
            const osVersion = getAppleOSVersion();

            /*
             * AL must never guess an edition.
             */
            if (!osVersion) {
                redirect(FIND_EDITION_URL);
                return;
            }

            const response = await fetch(EDITIONS_URL, {
                cache: "no-store"
            });

            if (!response.ok) {
                throw new Error(
                    `Unable to load editions.json (${response.status})`
                );
            }

            const data = await response.json();
            const editions = normalizeEditions(data);

            if (!editions.length) {
                redirect(FIND_EDITION_URL);
                return;
            }

            const edition = findEdition(editions, osVersion);

            /*
             * No matching Skylark edition.
             */
            if (!edition) {
                redirect(FIND_EDITION_URL);
                return;
            }

            /*
             * EOL ALWAYS has priority over release-page routing.
             */
            if (edition.eol === true) {
                redirect(EOL_URL);
                return;
            }

            /*
             * releasePage must come directly from editions.json.
             *
             * Empty/missing releasePage does NOT mean the edition
             * itself is unavailable. It means AL must send the user
             * to Find Edition.
             */
            if (
                typeof edition.releasePage !== "string" ||
                edition.releasePage.trim() === ""
            ) {
                redirect(FIND_EDITION_URL);
                return;
            }

            /*
             * Everything checks out.
             *
             * AUTO LAUNCH 🚀
             */
            redirect(edition.releasePage.trim());

        } catch (error) {
            console.error("Skylark Auto Launch failed:", error);

            /*
             * Never leave the user stranded on /AL.
             */
            redirect(FIND_EDITION_URL);
        }
    }

    autoLaunch();
})();
</script>
</head>

<body>
</body>
</html>
